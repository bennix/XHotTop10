<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Hot News Finder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>X 热门帖子</h1>
          <p id="statusText" role="status" aria-live="polite">准备扫描</p>
        </div>
      </header>

      <section class="controls" aria-label="扫描设置">
        <label class="field">
          <span>滚动页数</span>
          <input id="pagesInput" type="number" min="5" max="20" value="5" />
        </label>
        <button id="scanButton" type="button">开始扫描</button>
      </section>

      <div class="progress" role="progressbar" aria-label="扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progressBar"></span>
      </div>

      <section class="actions">
        <button id="exportButton" type="button" disabled>导出 MD</button>
      </section>

      <section class="sectionHeader" aria-label="结果栏目">
        <h2>24 小时内最热门的帖子</h2>
        <span>前十大</span>
      </section>

      <ol id="resultList" class="results"></ol>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
